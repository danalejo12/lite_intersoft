{% extends "base.html" %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
    <div class="encabezado">
        <div>
            <h1 class="titulo-gradiente">{{ titulo }}</h1>
            <p class="subtitulo">Completa la información del producto.</p>
        </div>
        <a href="{% url 'producto_lista' %}" class="btn btn-ghost">← Volver</a>
    </div>

    <section class="tarjeta spotlight formulario">
        <form method="post" novalidate>
            {% csrf_token %}
            {% include "products/_campos.html" %}

            <div class="acciones-form">
                <button type="submit" class="btn">💾 Guardar</button>
                <a href="{% url 'producto_lista' %}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </section>
{% endblock %}
